<!DOCTYPE html><html><head><meta charset="UTF-8"><title>cui</title></head><body><script>
(async function () {
  const page = new URLSearchParams(location.search).get('page') || 'habitos.html';
  let html = await (await fetch(page + '?_=' + Date.now())).text();
  html = html.replace(/<script src="js\/supabase-config\.js"><\/script>\s*/,'')
             .replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2"><\/script>\s*/,'')
             .replace(/<script src="js\/supabase\.js"><\/script>\s*/,'')
             .replace(/(href|src)="((?:css|js)\/[^"]+)"/g, (m, a, p) => `${a}="${p}?_=${Date.now()}"`);
  const c = { select(){return this}, eq(){return this}, in(){return this}, not(){return this}, order(){return this},
    insert(){return this}, update(){return this}, upsert(){return this}, delete(){return this},
    async single(){return {data:null,error:null}}, then(r){r({data:null,error:null})} };
  window.sb = { from: () => Object.create(c) };
  document.open(); document.write(html); document.close();
})();
</script></body></html>
